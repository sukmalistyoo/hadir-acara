<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Buku Tamu Pernikahan</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#e8e7df;color:#263d34;font:15px/1.5 'DM Sans',system-ui,sans-serif}main{background:#fffdf6;max-width:520px;margin:22px auto;box-shadow:0 12px 45px #30473720;min-height:88vh}.cover{position:relative;isolation:isolate;text-align:center;padding:32px 20px 40px;overflow:hidden}.art{position:absolute;inset:0;z-index:-1;background:linear-gradient(#f5f4e6bf,#eef2e29c 55%,#e5ede035),url(sampul-pinus.jpg) center 54%/cover}.rose .art{filter:sepia(.45) hue-rotate(275deg)}.sage .art{filter:sepia(.3)}.cover small{font-size:10px;letter-spacing:.24em}.cover h1{font:italic 48px/1.03 Georgia,serif;letter-spacing:-.05em;margin:12px 0;overflow-wrap:anywhere}.cover p{margin:0;font:14px Georgia,serif}.page{padding:24px clamp(20px,6vw,38px) 30px}.line{display:flex;align-items:center;gap:14px;margin-bottom:17px}.line:after{content:'';height:1px;background:#c7bc9e;flex:1}h2{font:normal 30px/1.1 Georgia,serif;margin:0}.field{display:block;margin-bottom:14px;font-size:13px;font-weight:550}input,select{display:block;width:100%;background:transparent;color:inherit;line-height:1.4;font-family:inherit;font-size:16px;border:0;border-bottom:1px solid #aab4a4;padding:7px 1px;border-radius:0}input:focus,select:focus{outline:0;border-color:#2d5945;box-shadow:0 1px #2d5945}.pair{display:grid;grid-template-columns:minmax(0,1fr) 87px;gap:18px}.sighead{display:flex;justify-content:space-between;align-items:center;font-size:13px}.sighead button{background:none;border:0;text-decoration:underline;color:#526956;padding:7px}canvas{width:100%;height:96px;border:1px solid #c9cbbb;border-radius:5px;touch-action:none;background:linear-gradient(transparent 72%,#dedecf 73%,transparent 74%)}button{font:inherit;cursor:pointer}.submit{margin-top:16px;width:100%;border:0;border-radius:5px;background:#274e3f;color:white;padding:12px}.submit:disabled{opacity:.55}.message{font-size:14px}.done{padding:32px 0;text-align:center}.done h2{margin-bottom:10px}@media(max-width:550px){main{margin:0;min-height:100dvh}.cover h1{font-size:40px}.cover{padding:24px 16px 30px}}
</style></head><body><main><header class="cover"><div class="art"></div><small>THE WEDDING OF</small><h1 id="names">Pernikahan</h1><p id="event"></p></header>
<section class="page"><div class="line" id="heading"><h2>Buku tamu</h2></div>
<form id="entry" hidden><label class="field">Nama tamu<input name="name" autocomplete="name" maxlength="70" required></label><div class="pair"><label class="field">Alamat / kota<input name="address" maxlength="100" autocomplete="address-level2"></label><label class="field">Jumlah orang<select name="count"></select></label></div>
<div class="sighead"><label for="ink">Tanda tangan</label><button type="button" id="clear">Ulangi</button></div><canvas id="ink" width="400" height="112" aria-label="Bidang tanda tangan"></canvas>
<button class="submit">Simpan kehadiran</button></form><p id="msg" class="message" role="status">Membuka buku tamu…</p><section class="done" id="done" hidden><h2>Terima kasih</h2><p>Kehadiran Anda sudah tercatat.</p></section></section></main><script src="buku-tamu.js?v=studio4"></script></body></html>
