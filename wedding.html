<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Undangan & Buku Tamu · Hadir Acara</title><link rel="stylesheet" href="wedding.css"><link rel="stylesheet" href="undangan.css?v=studio4">
<header><a class="brand" href="dinas.html"><b>HA</b> Hadir Acara</a><nav><a href="dinas.html">Rapat dinas</a><strong>Wedding</strong></nav></header>
<main><div class="heading"><div><small>WEDDING</small><h1>Undangan &amp; buku tamu</h1></div><span class="badge">Demo</span></div>
<div class="spread"><section id="studio" hidden><div class="switch"><button id="show-invite" aria-pressed="true">Undangan</button><button id="show-book" aria-pressed="false">Buku tamu</button></div><fieldset id="invitation-options"><legend>Undangan digital</legend><label>Template<select id="design"><option value="floral">Floralia</option><option value="pinus">Hutan Pinus</option><option value="klasik">Klasik Emas</option></select></label><label>Isi undangan<select id="wording"><option value="umum">Umum</option><option value="islami">Islami</option></select></label><label>Nama penerima<input id="to" maxlength="70" placeholder="Opsional"></label></fieldset><iframe id="stage" title="Pratinjau undangan"></iframe></section><section class="cover" aria-label="Sampul undangan"><div class="cover-paper"></div><div class="rings" aria-hidden="true"></div><div class="cover-copy"><span>THE WEDDING OF</span><h2 id="couple"></h2><p id="when"></p><i>❦</i></div><div class="dedication" hidden><span>Kepada Yth.</span><strong id="recipient"></strong><button id="unseal">Buka Undangan</button></div><div class="cover-foot" id="venue"></div></section>
<section class="leaf"><div class="leaf-top"><small id="page-label">RESEPSI</small><span>01</span></div><h2 id="leaf-title">Buku tamu</h2>
<div id="owner"><div class="stats"><span><b id="expected">0</b> konfirmasi hadir</span><span><b id="arrived">0</b> orang datang</span></div>
<div class="tablewrap"><table><thead><tr><th>No.</th><th>Nama tamu</th><th>Alamat</th><th>Tanda tangan</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="actions"><button id="share">Bagikan undangan</button><button id="bookqr">QR Buku Tamu</button><button id="refresh" hidden>Segarkan</button></div></div>
<section id="occasion" hidden><p id="greeting"></p><p id="intro"></p><h2 id="names"></h2><h3 id="event-kind"></h3><p id="schedule"></p><p id="location"></p><p id="blessing"></p></section><form id="rsvp" hidden><label>Nama tamu<input name="name" required maxlength="70" autocomplete="name"></label><label>Alamat / kota<input name="address" maxlength="100"></label><label>Konfirmasi kedatangan<select name="attending"><option value="yes">Akan hadir</option><option value="no">Berhalangan</option></select></label><label id="numlabel">Jumlah orang<input name="count" type="number" min="1" max="10" value="1"></label><button>Kirim konfirmasi</button></form>
<p id="message" role="status"></p></section></div>
</main>
<dialog id="sharing"><h2>Undangan digital</h2><img id="qr" alt="QR undangan"><label>Tautan tamu<input id="url" readonly></label><a id="open" target="_blank" rel="noopener">Buka undangan ↗</a> <button id="copy">Salin</button> <button data-close>Tutup</button></dialog>
<dialog id="sign"><h2>Check-in tamu</h2><p id="signer"></p><canvas width="340" height="110"></canvas><button id="reset">Bersihkan</button> <button id="confirm">Simpan</button> <button data-close>Batal</button></dialog>
<script src="qr.js"></script><script src="wedding.js?v=studio5"></script></html>
