<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Daftar Hadir · Hadir Acara</title><link rel="stylesheet" href="dinas.css">
<header class="bar"><b>Hadir Acara</b><span>Rapat dinas</span><a href="wedding.html">Wedding ↗</a></header>
<main><h1>Form Daftar Hadir <small>Demo</small></h1><div class="workspace">
<aside id="forms"><details><summary>1. Kop Daftar Hadir <i>Custom kop</i></summary><label>Instansi<input data-field="instansi"></label><label>Unit / desa<input data-field="desa"></label><label>Alamat kantor<input data-field="kantor"></label></details>
<details open><summary>2. Keterangan Kegiatan &amp; Mengetahui</summary><label>Acara / Nama kegiatan<input data-field="acara"></label><label>Hari / Tanggal<input data-field="tanggal"></label><div class="pair"><label>Jam mulai<input data-field="mulai"></label><label>Jam selesai<input data-field="selesai"></label></div><label>Tempat<input data-field="tempat"></label><div class="pair"><label>Mengetahui<input data-field="jabatan"></label><label>Nama pejabat<input data-field="pejabat"></label></div></details>
<details><summary>3. Tambah Peserta &amp; Tanda Tangan</summary><form id="add"><label>Nama peserta<input name="nama" required maxlength="60"></label><div class="pair"><label>L/P<select name="jk"><option>L</option><option>P</option></select></label><label>Jabatan / unsur<input name="peran" maxlength="45"></label></div><label>Alamat<input name="alamat" maxlength="70"></label><label>Tanda tangan<canvas id="pad" width="360" height="90"></canvas></label><button type="button" id="clear">Bersihkan</button> <button>Tambah ke tabel</button></form></details>
<details><summary>4. Kelola Baris Tabel</summary><label>Jumlah baris kosong minimum<input id="slots" type="number" min="1" max="100"></label></details></aside>
<section class="preview"><article id="paper"><div class="letter"><div class="kop-mark" aria-label="Hadir Acara"><b>H</b><b>A</b></div><strong data-text="instansi"></strong><b data-text="desa"></b><span data-text="kantor"></span></div><h2>DAFTAR HADIR</h2><dl id="meta"></dl><table><colgroup><col style="width:5%"><col style="width:24%"><col style="width:5%"><col style="width:27%"><col style="width:20%"><col style="width:19%"></colgroup><thead><tr><th>No.</th><th>NAMA</th><th>L/P</th><th>ALAMAT</th><th>JABATAN / UNSUR</th><th>TANDA TANGAN</th></tr></thead><tbody></tbody></table><div class="approval">Mengetahui,<br><span data-text="jabatan"></span><p data-text="pejabat"></p></div></article></section>
<aside class="actions"><strong>ARSIP &amp; AKSI</strong><select id="archive" aria-label="Arsip lokal"></select><button id="new">＋ Baru</button><button id="save">Simpan lokal</button><button id="qr">QR Rapat</button><a class="primary" href="https://pemdesgripit.id/demo/hadir-acara/materi.html" target="_blank" rel="noopener">Materi Rapat ↗</a><button onclick="print()">PDF / Cetak</button><output id="status"></output></aside></div></main>
<dialog id="dialog"><b>QR Rapat</b><img src="qr-rapat.png" alt="QR form peserta" width="200"><form method="dialog"><button>Tutup</button></form></dialog><script src="dinas.js"></script></html>
