<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Materi Rapat · Hadir Acara</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f0;color:#193731;font:15px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:clamp(12px,3vw,34px)}header,.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}header{justify-content:space-between;border-bottom:1px solid #c3d1c5}h1{font-size:20px}button,a{color:inherit}button{font:inherit;background:white;border:1px solid #adbbb3;padding:6px 12px;border-radius:6px;cursor:pointer}button:disabled{opacity:.4}article{aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;background:#17433a;color:white;padding:6%;border-radius:6px}article h2{font:500 clamp(23px,4vw,50px)/1.1 Georgia;margin:12px 0}article p{max-width:42em;margin:4px 0}article small{color:#d9deb5}dialog{border:1px solid #bac7be;border-radius:10px;text-align:center;max-width:92vw}dialog img{width:min(235px,70vw);display:block;margin:auto}dialog::backdrop{background:#10241c80}[hidden]{display:none!important}#msg{color:#526b60}</style>
<main><header><h1>Materi Rapat</h1><a href="https://sukmalistyoo.github.io/hadir-acara/index.html">Hadir Acara</a></header>
<div id="setup"><button id="start">Mulai sesi demo</button> <span>3 slide contoh · sesi 1 jam</span></div>
<div class="controls" id="tools" hidden><button id="prev" aria-label="Slide sebelumnya">←</button><button id="next" aria-label="Slide berikutnya">→</button><button id="share">QR Materi</button></div>
<article hidden><small id="num"></small><h2 id="title"></h2><p id="body"></p></article><p id="msg" role="status"></p></main>
<dialog><b>Pindai untuk mengikuti presentasi</b><img id="code" alt="QR Materi"><p><a id="guest" target="_blank" rel="noopener">Buka layar peserta ↗</a></p><button id="copy">Salin tautan</button> <button id="close">Tutup</button></dialog>
<script src="qr.js"></script><script src="materi.js"></script></html>
